<html>

<head>
    <title>Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #b39ddb;
        }

        .caixa {
            width: 900px;
            height: 580px;
            margin: 50px auto;
            background-color: white;
            border-radius: 20px;
            overflow: hidden;
        }

        .esquerda {
            width: 55%;
            height: 100%;
            float: left;
            background-color: #6845b5;
        }

        .esquerda h1 {
            color: white;
            margin-top: 210px;
            margin-left: 80px;
            font-size: 40px;
        }

        .esquerda p {
            color: white;
            margin-left: 80px;
            font-size: 18px;
            width: 400px;
        }

        .direita {
            width: 45%;
            height: 100%;
            float: left;
            background-color: white;
        }

        .login {
            width: 80%;
            margin: 100px auto;
        }

        .login h1 {
            font-size: 36px;
            color: #333;
        }

        input {
            display: block;
            width: 90%;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 15px;
        }

        .opcoes {
            font-size: 13px;
            margin: 15px 0;
        }

        .opcoes input {
            display: inline;
            width: auto;
        }

        .botao {
            display: block;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 25px;
            background-color: #6845b5;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        .cadastro {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
        }

        .scadastro a {
            color: #6845b5;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <div class="caixa">

        <div class="esquerda">

            <h1>Welcome back!</h1>

            <p>
                You can sign in to access with your
                existing account.
            </p>

        </div>


        <div class="direita">

            <div class="login">

                <h1>Sign In</h1>

                <input type="text" placeholder="Username or email">

                <input type="password" placeholder="Password">

                <div class="opcoes">

                    <input type="checkbox">

                    Remember me

                    &nbsp;&nbsp;&nbsp;&nbsp;

                    Forgot password?

                </div>

                <button class="botao">
                    Sign In
                </button>

                <div class="cadastro">

                    New here?

                    <a href="#">
                        Create an Account
                    </a>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
